<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patricia and Lance - Invitation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #f5e6d3 0%, #e8d5c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 100vh;
            gap: 10px;
            padding: 10px 0;
        }

        .book-container {
            perspective: 2000px;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            position: relative;
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            max-height: 100%;
            transform-style: preserve-3d;
            margin: 0 auto;
        }

        .click-zone {
            position: absolute;
            top: 0;
            width: 20%;
            height: 100%;
            z-index: 100;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .left-zone {
            left: 0;
        }

        .right-zone {
            right: 0;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.2);
            transform-origin: left;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            border-radius: 0 5px 5px 0;
            overflow: hidden;
        }

            .page img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
                background: #fafaf9;
            }

            .page.flipped {
                transform: rotateY(-180deg);
            }

            /* Gutter shadow for realism */
            .page::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 10px;
                height: 100%;
                background: linear-gradient(to right, rgba(0, 0, 0, 0.15) 0%, transparent 100%);
                pointer-events: none;
                z-index: 1;
            }

        .controls {
            display: flex;
            gap: 15px;
            flex-shrink: 0;
            z-index: 101;
        }

        .btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #c4a57b;
            border-radius: 50px;
            cursor: pointer;
            font-size: 15px;
            font-family: 'Georgia', serif;
            color: #5a4a3a;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .btn:hover:not(:disabled) {
                background: #c4a57b;
                color: white;
                transform: translateY(-2px);
            }

            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

        .page-indicator {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 13px;
            color: #5a4a3a;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .swipe-hint {
            text-align: center;
            font-size: 13px;
            color: #3a2a1a;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 20px;
            border-radius: 25px;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #5a4a3a;
            text-align: center;
        }

            .loading::after {
                content: '...';
                animation: dots 1.5s infinite;
            }

        @keyframes dots {
            0%, 20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60%, 100% {
                content: '...';
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Loading your invitation</div>

    <div class="container-wrapper" id="containerWrapper" style="display: none;">
        <div class="page-indicator" id="pageIndicator">Page 1 of 6</div>

        <div class="book-container">
            <div class="click-zone left-zone" id="leftZone"></div>
            <div class="click-zone right-zone" id="rightZone"></div>

            <div class="book" id="book">
                <div class="page" data-page="1">
                    <img src="./1.webp" alt="Page 1">
                </div>
                <div class="page" data-page="2">
                    <img src="./2.webp" alt="Page 2">
                </div>
                <div class="page" data-page="3">
                    <img src="./3.webp" alt="Page 3">
                </div>
                <div class="page" data-page="4">
                    <img src="./4.webp" alt="Page 4">
                </div>
                <div class="page" data-page="5">
                    <img src="./5.webp" alt="Page 5">
                </div>
                <div class="page" data-page="6">
                    <img src="./6.webp" alt="Page 6">
                </div>
            </div>
        </div>

        <div class="swipe-hint">Tap sides, swipe, or use buttons to flip</div>

        <div class="controls">
            <button class="btn" id="prevBtn" disabled><span class="arrow">←</span> Previous</button>
            <button class="btn" id="nextBtn">Next <span class="arrow">→</span></button>
        </div>
    </div>

    <script>
        let currentPage = 0;
        let isLooping = false;
        const totalPages = 6;
        const pages = document.querySelectorAll('.page');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageIndicator = document.getElementById('pageIndicator');
        const loading = document.getElementById('loading');
        const containerWrapper = document.getElementById('containerWrapper');
        const leftZone = document.getElementById('leftZone');
        const rightZone = document.getElementById('rightZone');

        // Preload logic
        let imagesLoaded = 0;
        const images = document.querySelectorAll('.page img');
        images.forEach(img => {
            if (img.complete) imageLoaded();
            else {
                img.addEventListener('load', imageLoaded);
                img.addEventListener('error', imageLoaded);
            }
        });

        function imageLoaded() {
            imagesLoaded++;
            if (imagesLoaded === images.length) {
                loading.style.display = 'none';
                containerWrapper.style.display = 'flex';
                updatePage();
            }
        }

        function updatePage() {
            pages.forEach((page, index) => {
                if (index < currentPage) {
                    page.classList.add('flipped');
                    page.style.zIndex = index;
                } else {
                    page.classList.remove('flipped');
                    page.style.zIndex = totalPages - index;
                }
            });

            pageIndicator.textContent = `Page ${currentPage + 1} of ${totalPages}`;
            prevBtn.disabled = (currentPage === 0);
        }

        async function nextPage() {
            if (isLooping) return;

            if (currentPage < totalPages - 1) {
                currentPage++;
                updatePage();
            } else {
                isLooping = true;
                nextBtn.disabled = true;

                for (let i = totalPages - 2; i >= 0; i--) {
                    currentPage = i;
                    updatePage();
                    await new Promise(resolve => setTimeout(resolve, 150));
                }

                isLooping = false;
                nextBtn.disabled = false;
                updatePage();
            }
        }

        function prevPage() {
            if (isLooping || currentPage === 0) return;
            currentPage--;
            updatePage();
        }

        // Listeners
        leftZone.addEventListener('click', prevPage);
        rightZone.addEventListener('click', nextPage);
        nextBtn.addEventListener('click', nextPage);
        prevBtn.addEventListener('click', prevPage);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
        });

        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => touchStartX = e.changedTouches[0].screenX, { passive: true });
        document.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 50) diff > 0 ? nextPage() : prevPage();
        }, { passive: true });

        let scrollTimeout;
        document.addEventListener('wheel', (e) => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => e.deltaY > 0 ? nextPage() : prevPage(), 100);
        }, { passive: true });
    </script>
</body>
</html>
